<!doctype html>
<meta charset="utf-8">
<title>Replica chat — stuck release (button no-op, synthetic Enter ignored)</title>
<style>body{font-family:sans-serif;background:#17171a;color:#eee} .msg{margin:6px;padding:6px;background:#232329;border-radius:8px} .msg img{max-width:200px;display:block} .chip img{max-width:120px}</style>
<div id="msgs"></div>
<div id="chatbox">
  <div id="attachments"></div>
  <form id="composerForm">
    <div id="composer" contenteditable="true" style="border:1px solid #555;min-height:40px;padding:6px"></div>
    <button id="sendBtn" type="button" aria-label="Send message">Send</button>
  </form>
</div>
<script>
  var composer = document.getElementById('composer');
  var attachments = document.getElementById('attachments');
  var msgs = document.getElementById('msgs');
  function send() {
    var text = composer.innerText.trim();
    var chips = attachments.querySelectorAll('img');
    if (!text && chips.length === 0) return;
    var d = document.createElement('div');
    d.className = 'msg';
    d.textContent = text;
    chips.forEach(function (img) { var c = img.cloneNode(); d.appendChild(c); });
    msgs.appendChild(d);
    composer.innerHTML = '';
    attachments.innerHTML = '';
  }
  // This page IGNORES synthetic Enter (checks isTrusted, like strict
  // editors) and its Send button is wired to nothing: the only way to send
  // is a REAL Enter keystroke. Models the v1.3.1 real-world failure where
  // the host reported "released" while the message sat in the composer.
  composer.addEventListener('keydown', function (e) {
    if (!e.isTrusted) return;
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  });
  document.getElementById('sendBtn').addEventListener('click', function () { /* no-op */ });
  document.addEventListener('paste', function (e) {
    var files = (e.clipboardData || {}).files || [];
    for (var i = 0; i < files.length; i++) {
      var chip = document.createElement('div');
      chip.className = 'chip';
      var img = document.createElement('img');
      img.src = URL.createObjectURL(files[i]);
      chip.appendChild(img);
      attachments.appendChild(chip);
    }
    if (files.length) e.preventDefault();
  });
</script>
