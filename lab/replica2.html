<!doctype html>
<meta charset="utf-8">
<title>Replica chat — attachment strip OUTSIDE the composer form (muse.ai layout)</title>
<style>body{font-family:sans-serif;background:#17171a;color:#eee} .msg{margin:6px;padding:6px;background:#232329;border-radius:8px} .msg img{max-width:200px;display:block} .chip img{max-width:120px}</style>
<div id="msgs"></div>
<div id="chatbox">
  <div id="attachments"></div>
  <form id="composerForm">
    <div id="composer" contenteditable="true" style="border:1px solid #555;min-height:40px;padding:6px"></div>
    <button id="sendBtn" type="button" aria-label="Send message">Send</button>
  </form>
</div>
<script>
  var composer = document.getElementById('composer');
  var attachments = document.getElementById('attachments');
  var msgs = document.getElementById('msgs');
  function send() {
    var text = composer.innerText.trim();
    var chips = attachments.querySelectorAll('img');
    if (!text && chips.length === 0) return;
    var d = document.createElement('div');
    d.className = 'msg';
    d.textContent = text;
    chips.forEach(function (img) { var c = img.cloneNode(); d.appendChild(c); });
    msgs.appendChild(d);
    composer.innerHTML = '';
    attachments.innerHTML = '';
  }
  composer.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  });
  document.getElementById('sendBtn').addEventListener('click', send);
  // Like muse.ai, paste is handled at the DOCUMENT level, and the preview
  // strip is rendered into a sibling container outside the composer form.
  // The thumbnail renders SLOWLY (2s — upload/preview pipeline): a host
  // that escalates to a second attach path before ~2s duplicates the image.
  document.addEventListener('paste', function (e) {
    var files = (e.clipboardData || {}).files || [];
    for (var i = 0; i < files.length; i++) {
      (function (file) {
        setTimeout(function () {
          var chip = document.createElement('div');
          chip.className = 'chip';
          var img = document.createElement('img');
          img.src = URL.createObjectURL(file);
          chip.appendChild(img);
          attachments.appendChild(chip);
        }, 2000);
      })(files[i]);
    }
    if (files.length) e.preventDefault();
  });
</script>
